# Required by the application's AndroidX/Compose dependencies.
android.useAndroidX=true

# Use KSP2 with Kotlin 2.0; KSP1's byRounds shadow outputs duplicated generated
# classes on this toolchain even after a clean with incremental KSP disabled.
ksp.useKSP2=true

# Keep full Android/Kotlin builds within a predictable heap on local and CI hosts.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
