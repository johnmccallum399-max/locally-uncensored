name: Android verification

on:
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android tests, lint and debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Record toolchain
        run: |
          java -version
          javac -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Run JVM unit tests
        id: tests
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest

      - name: Compile and package debug APK
        id: apk
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug

      - name: Android lint
        id: lint
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:lintDebug

      - name: Save test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-verification-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Save debug APK
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcdr-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Verification summary
        if: ${{ !cancelled() }}
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          APK_RESULT: ${{ steps.apk.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
        run: |
          {
            echo '### LCDR Android verification'
            echo "Commit checked: $GITHUB_SHA"
            echo "- JVM helper tests: $TEST_RESULT"
            echo "- Full debug APK compilation: $APK_RESULT"
            echo "- Android lint: $LINT_RESULT"
            echo '- Device/emulator, lifecycle, interruption, offline audio and voice identity: NOT RUN'
            echo '- No install, deployment, release signing or merge performed.'
          } >> "$GITHUB_STEP_SUMMARY"
